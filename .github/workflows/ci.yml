name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    name: offline regression (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run offline tests
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q
      # 这些入口必须能在「没有 PYTHONPATH」的情况下直接运行（自举 sys.path）
      - name: CLI smoke test (no PYTHONPATH)
        run: |
          python src/ingest/corpus.py --help
          python src/ingest/build_kg.py --help
          python src/ingest/clean_graph.py --help
          python src/ingest/entity_alignment.py --help
          python run_frontend_server.py --help
