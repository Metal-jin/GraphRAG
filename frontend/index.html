<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金庸武侠知识图谱问答系统</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link href="https://unpkg.com/vis-network/styles/vis-network.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #12122a; color: #e8e8f0; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .header {
            padding: 14px 24px; background: linear-gradient(135deg, #1e1e3f 0%, #2a1e4f 100%);
            border-bottom: 1px solid #3a3a6a; display: flex; align-items: center; justify-content: space-between;
        }
        .header h1 {
            font-size: 20px; font-weight: 600; letter-spacing: 1px;
            background: linear-gradient(90deg, #7ec8ff, #b48cff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header .sub { font-size: 13px; color: #8a8ab0; }
        .main { flex: 1; display: flex; min-height: 0; }
        .panel {
            width: 360px; padding: 18px; background: #1a1a36; border-right: 1px solid #3a3a6a;
            display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
        }
        .panel h2 { font-size: 15px; color: #9ab8ff; font-weight: 600; }
        #questionInput {
            width: 100%; height: 90px; padding: 12px; background: #12122a; border: 1px solid #3a3a6a;
            border-radius: 10px; color: #e8e8f0; font-size: 14px; resize: vertical; outline: none;
            transition: border-color .2s;
        }
        #questionInput:focus { border-color: #7ec8ff; }
        #askBtn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #4a7dff, #7b4aff);
            border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: opacity .2s, transform .1s;
        }
        #askBtn:hover { opacity: .9; } #askBtn:active { transform: scale(.98); }
        .answer-card {
            background: #12122a; border: 1px solid #3a3a6a; border-radius: 10px; padding: 14px;
            min-height: 80px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
        }
        .graph-wrap { flex: 1; position: relative; min-width: 0; }
        #network { width: 100%; height: 100%; background: radial-gradient(circle at 50% 40%, #1a1a3a 0%, #12122a 100%); }
        .footer {
            padding: 12px 24px; background: #1a1a36; border-top: 1px solid #3a3a6a;
            display: flex; align-items: center; gap: 14px;
        }
        .footer label { font-size: 14px; color: #9ab8ff; white-space: nowrap; }
        .legend {
            position: absolute; top: 12px; left: 12px; z-index: 10;
            background: rgba(18,18,42,.85); border: 1px solid #3a3a6a; border-radius: 10px;
            padding: 10px 12px; font-size: 12px; color: #c8c8e0;
            display: flex; flex-direction: column; gap: 5px;
        }
        .legend .row { display: flex; align-items: center; gap: 6px; }
        .legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .legend .hint { margin-top: 4px; color: #8a8ab0; font-size: 11px; }
        #eraSlider { flex: 1; accent-color: #7b4aff; }
        #eraText { font-size: 14px; color: #b48cff; font-weight: 600; min-width: 90px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>金庸武侠知识图谱问答系统</h1>
        <span class="sub">GraphRAG · 意图分类 + 领域检索</span>
    </div>

    <div class="main">
        <div class="panel">
            <h2>🔍 提问</h2>
            <textarea id="questionInput" placeholder="例如：郭靖的师父的师父是谁？"></textarea>
            <button id="askBtn">提 问</button>
            <h2>💬 回答</h2>
            <div class="answer-card" id="answerBox">（答案将显示在这里）</div>
        </div>
        <div class="graph-wrap">
            <div class="legend">
                <div class="row"><span class="dot" style="background:#4fc3f7"></span>人物</div>
                <div class="row"><span class="dot" style="background:#ffb74d"></span>门派</div>
                <div class="row"><span class="dot" style="background:#81c784"></span>武功</div>
                <div class="row"><span class="dot" style="background:#ba68c8"></span>地点</div>
                <div class="hint">滚轮缩放 · 拖拽平移 · 悬停看名 · 点击节点展开关系</div>
            </div>
            <div id="network"></div>
        </div>
    </div>

    <div class="footer">
        <label>时代过滤</label>
        <input type="range" id="eraSlider" min="1" max="3" value="1">
        <span id="eraText">射雕英雄传</span>
    </div>

    <script>
        // ============ 颜色映射 ============
        // 实体类型 → 颜色/形状（人物圆、门派方、武功菱形、地点三角）
        const typeStyle = {
            "人物": { color: "#4fc3f7", shape: "dot" },
            "门派": { color: "#ffb74d", shape: "square" },
            "武功": { color: "#81c784", shape: "diamond" },
            "地点": { color: "#ba68c8", shape: "triangle" },
        };
        // 关系类型（中文简称）→ 边颜色
        const relColor = {
            "师徒": "#4fc3f7", "夫妻": "#f06292", "父母": "#81c784",
            "仇敌": "#e57373", "结拜": "#ffb74d", "门派": "#ffb74d",
            "精通": "#81c784", "创立": "#ba68c8", "位置": "#90a4ae",
            "演化": "#ba68c8", "后裔": "#f06292",
        };

        // ============ 初始化 vis-network ============
        const nodes = new vis.DataSet([]);
        const edges = new vis.DataSet([]);
        const container = document.getElementById("network");
        const options = {
            nodes: {
                shape: "dot", size: 16,
                // 节点上直接显示名字（默认只有 30 个节点，不会乱）
                font: { size: 12, color: "#e8e8f0", face: "PingFang SC, Microsoft YaHei", background: "#12122a" },
                borderWidth: 1.5, borderWidthSelected: 3,
                color: { background: "#4fc3f7", border: "#8fd4ff", highlight: { background: "#fff", border: "#fff" } },
            },
            edges: {
                arrows: { to: { enabled: true, scaleFactor: 0.6 } },
                smooth: { type: "continuous" },
                width: 1.2,
                // 边上显示关系类型（中文小字）
                font: { size: 10, color: "#9a9ab0", face: "PingFang SC, Microsoft YaHei", background: "#12122a" },
                color: { color: "#5a5a8a", highlight: "#ffd54f" },
            },
            physics: {
                enabled: true,
                // 减小引力、增大弹簧长度，让节点更分散，避免中心节点爆炸状辐射
                barnesHut: { gravitationalConstant: -800, springLength: 240, springConstant: 0.004 },
                stabilization: { iterations: 250 },
            },
            interaction: {
                hover: true, tooltipDelay: 100,
                zoomView: true,         // 滚轮缩放
                dragView: true,         // 拖拽平移
                navigationButtons: true, // 右下角显示 +/- 缩放按钮
                keyboard: true,          // 键盘方向键平移
            },
        };
        const network = new vis.Network(container, { nodes, edges }, options);

        // ============ 给节点/边套样式 ============
        // title 用于 hover 时显示名字（因为 label 文字被隐藏了）
        function styleNodes(nodeArr) {
            return nodeArr.map(n => {
                const s = typeStyle[n.type] || typeStyle["人物"];
                return { ...n, title: n.label, shape: s.shape,
                         color: { background: s.color, border: "#ffffff", highlight: { background: "#fff" } } };
            });
        }
        function styleEdges(edgeArr) {
            return edgeArr.map(e => {
                const c = relColor[e.label] || "#5a5a8a";
                return { ...e, color: { color: c, highlight: "#ffd54f" } };
            });
        }

        // ============ 提问 ============
        document.getElementById("askBtn").onclick = async () => {
            const q = document.getElementById("questionInput").value.trim();
            if (!q) { alert("请输入问题"); return; }
            const resp = await fetch("/api/qa", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: q })
            });
            const res = await resp.json();
            document.getElementById("answerBox").innerText = res.answer || "（无答案）";
            nodes.clear(); edges.clear();
            if (res.subgraph) {
                nodes.add(styleNodes(res.subgraph.nodes || []));
                edges.add(styleEdges(res.subgraph.edges || []));
            }
            highlightPath(res.path || []);
        };

        // ============ 高亮推理路径 ============
        function highlightPath(pathArr) {
            nodes.update(nodes.getIds().map(id => ({ id, color: undefined })));
            edges.update(edges.getIds().map(id => ({ id, color: undefined })));
            for (const nid of pathArr) {
                nodes.update({ id: nid, color: { background: "#ff5252", border: "#fff" } });
            }
            for (let i = 0; i < pathArr.length - 1; i++) {
                const from = pathArr[i], to = pathArr[i + 1];
                for (const e of edges.get()) {
                    if ((e.from === from && e.to === to) || (e.from === to && e.to === from)) {
                        edges.update({ id: e.id, color: { color: "#ff5252", highlight: "#ff5252" } });
                    }
                }
            }
        }

        // ============ 点击节点展开邻居 ============
        network.on("click", async (params) => {
            if (params.nodes.length === 0) return;
            const nodeId = params.nodes[0];
            const r = await fetch(`/api/node/neighbor?nodeId=${encodeURIComponent(nodeId)}`);
            const json = await r.json();
            nodes.add(styleNodes(json.nodes || []));
            edges.add(styleEdges(json.edges || []));
        });

        // ============ 时代滑块过滤 ============
        const eraMap = { 1: "射雕英雄传", 2: "神雕侠侣", 3: "倚天屠龙记" };
        const slider = document.getElementById("eraSlider");
        const eraTextDom = document.getElementById("eraText");
        slider.oninput = async function () {
            const val = this.value;
            eraTextDom.innerText = eraMap[val];
            const resp = await fetch(`/api/graph/byera?era=${encodeURIComponent(eraMap[val])}`);
            const data = await resp.json();
            nodes.clear(); edges.clear();
            nodes.add(styleNodes(data.nodes || []));
            edges.add(styleEdges(data.edges || []));
        };
    </script>
</body>
</html>
