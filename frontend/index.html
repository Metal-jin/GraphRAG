<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>GraphRAG金庸武侠问答</title>
    <!-- vis-network 图谱库 -->
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link href="https://unpkg.com/vis-network/styles/vis-network.min.css" rel="stylesheet">
</head>
<body>
<div style="display:flex;height:90vh;">
    <!-- 左侧问答面板 -->
    <div style="width:350px;padding:10px;border-right:1px solid #ccc;">
        <h3>金庸武侠问答</h3>
        <textarea id="questionInput" style="width:100%;height:100px;" placeholder="输入你的问题"></textarea>
        <br>
        <button id="askBtn">提问</button>
        <div>
            <h4>回答</h4>
            <div id="answerBox"></div>
        </div>
    </div>
    <!-- 右侧图谱画布，id=network 必须和js匹配 -->
    <div style="flex:1;padding:10px;">
        <div id="network" style="width:100%;height:100%;border:1px solid #ccc;"></div>
    </div>
</div>
<!-- 底部时代滑块 -->
<div style="padding:10px;">
    <label>时代过滤：</label>
    <input type="range" id="eraSlider" min="1" max="3" value="1">
    <span id="eraText">射雕英雄传</span>
</div>

<script>
// ========= Step2：初始化vis-network =========
const nodes = new vis.DataSet([]);
const edges = new vis.DataSet([]);
const container = document.getElementById("network");
const data = { nodes, edges };
const options = {
    layout: { hierarchical: false }, // 关闭层级，力导向
    nodes: {
        shape: "dot",
        size: 15,
        font: { size: 14 }
    },
    edges: {
        arrows: { to: { enabled: true } },
        smooth: true
    },
    physics: {
        enabled: true,
        barnesHut: { gravitationalConstant: -2000 }
    }
};
const network = new vis.Network(container, data, options);

// ========= Step3：提问按钮点击事件 =========
document.getElementById("askBtn").onclick = async ()=>{
    const q = document.getElementById("questionInput").value;
    const resp = await fetch("/api/qa",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({question: q})
    });
    const res = await resp.json();
    document.getElementById("answerBox").innerText = res.answer;
    // 清空旧图谱，渲染本次子图
    nodes.clear();
    edges.clear();
    nodes.add(res.subgraph.nodes);
    edges.add(res.subgraph.edges);
    // 高亮推理路径
    highlightPath(res.path);
}

// ========= Step5：高亮推理路径函数 =========
function highlightPath(pathArr){
    // 重置全部颜色
    nodes.update(nodes.getIds().map(id=>({id,color:undefined})));
    edges.update(edges.getIds().map(id=>({id,color:undefined})));
    // 高亮节点
    for(const nid of pathArr){
        nodes.update({id:nid, color:{background:"darkred"}});
    }
    // 高亮边
    for(let i=0;i<pathArr.length-1;i++){
        const from = pathArr[i];
        const to = pathArr[i+1];
        const allE = edges.get();
        for(const e of allE){
            if( (e.from===from && e.to===to) || (e.from===to && e.to===from) ){
                edges.update({id:e.id, color:"red"});
            }
        }
    }
}

// ========= Step4：点击节点，展开邻居 =========
network.on("click", async (params)=>{
    if(params.nodes.length ===0) return;
    const nodeId = params.nodes[0];
    const r = await fetch(`/api/node/neighbor?nodeId=${encodeURIComponent(nodeId)}`);
    const json = await r.json();
    nodes.add(json.nodes);
    edges.add(json.edges);
})

// ========= Step6：时代滑块过滤 =========
const eraMap = {
    1:"射雕英雄传",
    2:"神雕侠侣",
    3:"倚天屠龙记"
};
const slider = document.getElementById("eraSlider");
const eraTextDom = document.getElementById("eraText");
slider.oninput = async function(){
    const val = this.value;
    eraTextDom.innerText = eraMap[val];
    const eraName = eraMap[val];
    const resp = await fetch(`/api/graph/byera?era=${encodeURIComponent(eraName)}`);
    const data = await resp.json();
    nodes.clear();
    edges.clear();
    nodes.add(data.nodes);
    edges.add(data.edges);
}
</script>
</body>
</html>
